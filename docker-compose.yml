
services:
  db:
    image: postgres:16
    container_name: club_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 5s
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: club_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv  # prevents host .venv (Windows) from being mounted into the container
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; url='http://127.0.0.1:8000/health'; sys.exit(0) if urllib.request.urlopen(url, timeout=2).getcode()==200 else sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # If your alembic config file is not at /app/alembic.ini, adjust the -c path.
    command: ["uv", "run", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    volumes:
      - ./backend:/app
      - /app/.venv
    profiles:
      - migrate
    restart: "no"

volumes:
  postgres_data:
