[project]
name = "sigma-internal-database-c-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "passlib[bcrypt]>=1.7.4",
  "email-validator>=2.0.0",
  "argon2-cffi>=23.1.0",
  "python-jose[cryptography]>=3.3.0",
  "google-genai >= 0.3.0",
]
[tool.uv]
# Keep uv behavior simple and deterministic for teams.
# uv.lock will pin exact versions.

[tool.ruff]
# Optional. Remove if you don't want linting yet.
line-length = 100
